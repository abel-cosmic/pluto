[metadata]
author_name = "Abel Shibabaw"
author_email = "abelshibabaw291@gmail.com"
difficulty = "hard"

difficulty_explanation = "The task requires building a stateful ledger reconciliation and transaction cleaning pipeline in Python, handling deduplication, complex datetime parsing (ISO8601, Excel serial days, UNIX epoch), and matching child refund records to parent transactions."

solution_explanation = "A Python solution that reads transactions.json, cleans the fields, resolves user profile name/email collisions, processes transaction records, links refunds to original transactions, and generates row hashes."

verification_explanation = "A pytest test suite that validates that the final dataset has exactly 15 rows, correct schemas, precise calculations, and proper refund logic."

category = "data-engineering"
tags = ["json", "python", "data-cleaning", "reconciliation"]

